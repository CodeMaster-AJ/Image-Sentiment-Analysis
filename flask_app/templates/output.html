<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #0f172a;
            background: radial-gradient(circle at 15% 15%, #dbeafe 0, transparent 45%),
                        radial-gradient(circle at 85% 85%, #ede9fe 0, transparent 45%),
                        #f8fafc;
        }
        .card {
            width: min(100%, 520px);
            padding: 40px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, .12);
            text-align: center;
        }
        .eyebrow {
            margin: 0 0 10px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: #64748b;
        }
        h1 { margin: 0 0 8px; font-size: 30px; line-height: 1.2; }
        .lede { margin: 0 0 30px; color: #64748b; line-height: 1.6; }
        .badge {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .04em;
            text-transform: uppercase;
        }
        .positive .badge { background: #dcfce7; color: #15803d; }
        .negative .badge { background: #fee2e2; color: #b91c1c; }
        .score { display: flex; align-items: baseline; justify-content: center; gap: 6px; }
        .score strong { font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
        .score span { color: #94a3b8; font-size: 18px; }
        .meter { height: 12px; margin: 22px 0 10px; overflow: hidden; border-radius: 999px; background: #e2e8f0; }
        .meter span { display: block; height: 100%; border-radius: inherit; }
        .positive .meter span { background: linear-gradient(90deg, #22c55e, #16a34a); }
        .negative .meter span { background: linear-gradient(90deg, #f87171, #dc2626); }
        .scale { display: flex; justify-content: space-between; color: #94a3b8; font-size: 12px; }
        .back {
            display: inline-block;
            margin-top: 32px;
            padding: 13px 22px;
            border-radius: 12px;
            background: #4f46e5;
            color: #fff;
            font: inherit;
            font-weight: 600;
            text-decoration: none;
            transition: background .2s, transform .2s;
        }
        .back:hover { background: #4338ca; transform: translateY(-1px); }
    </style>
</head>
<body>
    {% set positive = prediction == 'Positive' %}
    <main class="card {{ 'positive' if positive else 'negative' }}">
        <p class="eyebrow">Analysis complete</p>
        <h1>{{ prediction }} sentiment detected</h1>
        <p class="lede">The model classified your image with the confidence score below.</p>

        <span class="badge">{{ prediction }}</span>

        <div class="score">
            <strong>{{ val }}</strong>
            <span>/ 10</span>
        </div>
        <div class="meter">
            <span style="width: {{ (val * 10) | round | int }}%"></span>
        </div>
        <div class="scale"><span>Negative</span><span>Positive</span></div>

        <a class="back" href="{{ url_for('index') }}">Analyze another image</a>
    </main>
</body>
</html>
